<ion-content class="login-container">
  <br><br>
  <!-- Logo -->
  <div class="logo-container">
    <img src="assets/images/login2.png" alt="Logo App" class="logo" />
  </div>

  <!-- Título -->
  <h1 class="title">Bienvenido</h1>
  <p class="subtitle">Inicia sesión para continuar</p>

  <!-- Formulario -->
  <form (ngSubmit)="login()" class="login-form">
    <ion-item lines="none" class="input-item">
      <ion-icon name="person-outline" slot="start"></ion-icon>
      <ion-input
        type="text"
        placeholder="Usuario"
        [(ngModel)]="usuario"
        name="usuario"
        required>
      </ion-input>
    </ion-item>

    <ion-item lines="none" class="input-item">
      <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
      <ion-input
        type="password"
        placeholder="Contraseña"
        [(ngModel)]="contrasena"
        name="contrasena"
        required>
      </ion-input>
    </ion-item>

    <!-- Botón login -->
    <ion-button expand="block" class="btn-login" type="submit">
      Iniciar Sesión
    </ion-button>
  </form>

  <!-- Enlace registro -->
  <div class="register-container">
    <p>¿No tienes una cuenta? 
      <a (click)="goToRegister()">Regístrate</a>
    </p>
  </div>
</ion-content>
